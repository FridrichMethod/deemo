name: Publish public gallery

# Only a vX.Y.Z tag whose commit is on main and that has a published GitHub Release, not marked as a prerelease, is
# deployed. Publishing such a Release deploys its commit, and so does a manual run on such a tag (gh workflow run
# pages.yml --ref vX.Y.Z). Every run, whichever of the two started it, first asks for the tag's Release with one
# read-only GitHub API request and goes on only if that Release is published and is neither a draft nor a prerelease: a
# re-run keeps the event of the run it repeats, so only the answer says what the Release is now (a re-run that leaves
# out the guard job, such as one of the deploy job alone, deploys nothing, because the deploy job requires the guard
# job's record of the current attempt; re-run the whole run). Pushes, pull requests and schedules never start this
# workflow; tests.yml checks them. The guard job refuses, with an error, every other run: another event, a branch, a
# release marked as a prerelease, a tag that is not vX.Y.Z (three numbers without leading zeros), a tag without such a
# Release, a commit that is not on main. It gives the commit of a run that passes all of this, and the run's attempt, as
# its outputs. The full tests.yml then runs on the release commit, the build job repeats the guards before anything else
# and stages the site, and the deploy job, whose condition requires a release tag again and the commit the guard job
# approved in the same attempt, publishes it. A repository ruleset ("Release tags v*") lets only repository admins
# create, move or delete v* tags, and the github-pages environment accepts deployments only from tags from v1.1.1 on: a
# run takes this file from the tag's commit, so the two keep anyone but an admin from deploying through the github-pages
# environment with a workflow of their own. A run on a tag older than v1.1.1 would take that tag's own workflow, which
# does not look up the Release, and the environment refuses its deployment. A run on v1.1.1 takes v1.1.1's workflow,
# whose deploy job does not yet require the guard job's record of the current attempt.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # Set by the last step, so empty unless every guard step passed; the deploy job runs only for this commit and only
      # in this attempt of the run: a re-run of later jobs alone keeps these outputs of the attempt it repeats.
      commit: ${{ steps.approve.outputs.commit }}
      attempt: ${{ steps.approve.outputs.attempt }}
    steps:
      - name: Refuse anything but a published release or a manual run on a vX.Y.Z tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          # In the C locale [0-9] is the ASCII digits only; in others it can match other scripts' digits too.
          LC_ALL: C
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release)
              [ "$EVENT_ACTION" = "published" ] || fail "Only publishing a release deploys the site, not a release event of type '$EVENT_ACTION'."
              [ "$PRERELEASE" = "false" ] || fail "Release $RELEASE_TAG is a prerelease, or does not say it is not one; a release marked as a prerelease is not deployed."
              [ "$REF" = "refs/tags/$RELEASE_TAG" ] || fail "The release's tag $RELEASE_TAG is not the run's ref $REF."
              ;;
            workflow_dispatch) ;;
            *) fail "The site is deployed only by publishing a release or by a manual run on a vX.Y.Z tag, not by a $EVENT_NAME event." ;;
          esac
          [[ "$REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "Only a vX.Y.Z tag, three numbers without leading zeros, is deployed, not '$REF'."
          echo "$REF is a vX.Y.Z tag."
      - name: Look up the GitHub Release of the tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # The job's token, which can only read (contents: read). curl reads it from stdin, so no command line has it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release | workflow_dispatch) ;;
            *) fail "The site is deployed only by publishing a release or by a manual run on a vX.Y.Z tag, not by a $EVENT_NAME event." ;;
          esac
          tag="${REF#refs/tags/}"
          # One GET, which GitHub answers with 200 only for a published Release. A release run makes it too: a re-run
          # keeps the event of the run it repeats, so only the answer says what the Release is now. The body, a newline
          # and the HTTP status go to the file that the next step reads.
          printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" |
            curl --silent --show-error --proto '=https' --max-time 60 --header @- \
              --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' \
              --write-out '\n%{http_code}' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              > "$RUNNER_TEMP/release-lookup" ||
            fail "GitHub could not be asked for the Release of $tag; only a tag that has a published Release that is not a prerelease is deployed."
          echo "Looked up the Release of $tag."
      - name: Refuse a tag without a published Release that is not a prerelease
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release | workflow_dispatch) ;;
            *) fail "The site is deployed only by publishing a release or by a manual run on a vX.Y.Z tag, not by a $EVENT_NAME event." ;;
          esac
          tag="${REF#refs/tags/}"
          # Says why the lookup's answer ($1: the body, a newline and the HTTP status) is not GitHub's 200 for a published
          # Release of tag $2 that is neither a draft nor a prerelease, and fails; says nothing if it is.
          check_release() {
            python3 -I - "$@" <<'PY'
          import json
          import sys

          path, tag = sys.argv[1:]
          try:
              with open(path, "rb") as file:
                  body, newline, status = file.read().rpartition(b"\n")
          except OSError as error:
              sys.exit(f"The Release lookup left no answer ({error.strerror}).")
          if not newline:
              sys.exit("The answer to the Release lookup has no HTTP status.")
          status = status.decode("ascii", "replace")
          if status != "200":
              sys.exit(f"GitHub answered the Release lookup with HTTP {status or '(none)'}, not 200 (404: the tag has no published Release).")
          try:
              release = json.loads(body)
          except ValueError as error:
              sys.exit(f"The answer to the Release lookup is not JSON ({error}).")
          if not isinstance(release, dict):
              sys.exit("The answer to the Release lookup is not a JSON object.")
          wrong = []
          for key, wanted in (("tag_name", tag), ("draft", False), ("prerelease", False)):
              if key not in release:
                  wrong.append(f"no {key}")
              elif type(release[key]) is not type(wanted) or release[key] != wanted:
                  wrong.append(f"{key} {json.dumps(release[key])}")
          if wrong:
              sys.exit(f"The Release GitHub returned has {', '.join(wrong)} (needed: tag_name {json.dumps(tag)}, draft false, prerelease false).")
          PY
          }
          reason="$(check_release "$RUNNER_TEMP/release-lookup" "$tag" 2>&1)" ||
            fail "A run on $tag is refused. $reason Only a tag that has a published Release that is not a prerelease is deployed."
          echo "$tag has a published GitHub Release that is not a prerelease."
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Every branch and tag with their commits, to find the release commit on main; the files of the root and
          # .github/ only.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - name: Refuse a release commit that is not on main
        env:
          SHA: ${{ github.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          head="$(git rev-parse --verify HEAD)" || fail "The checkout has no commit."
          [ "$head" = "$SHA" ] || fail "The checkout is $head, not the release commit $SHA."
          # The remote-tracking branch by its full name: a tag or local branch named like it cannot stand in for it.
          main="$(git show-ref --verify --hash refs/remotes/origin/main)" || fail "The checkout has no origin/main to look for $SHA on."
          git merge-base --is-ancestor "$SHA" "$main" || fail "$SHA is not on main; only a commit on main is released."
          echo "$SHA is on main."
      - name: Approve the release commit
        id: approve
        env:
          SHA: ${{ github.sha }}
        run: |
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  test:
    # The same checks as on every push and pull request, on the release commit; nothing is built unless they all pass.
    name: Test
    needs: guard
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    name: Build website artifact
    needs: [guard, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The guard job's steps again, before anything from the checkout runs (defence in depth).
      - name: Refuse anything but a published release or a manual run on a vX.Y.Z tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          # In the C locale [0-9] is the ASCII digits only; in others it can match other scripts' digits too.
          LC_ALL: C
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release)
              [ "$EVENT_ACTION" = "published" ] || fail "Only publishing a release deploys the site, not a release event of type '$EVENT_ACTION'."
              [ "$PRERELEASE" = "false" ] || fail "Release $RELEASE_TAG is a prerelease, or does not say it is not one; a release marked as a prerelease is not deployed."
              [ "$REF" = "refs/tags/$RELEASE_TAG" ] || fail "The release's tag $RELEASE_TAG is not the run's ref $REF."
              ;;
            workflow_dispatch) ;;
            *) fail "The site is deployed only by publishing a release or by a manual run on a vX.Y.Z tag, not by a $EVENT_NAME event." ;;
          esac
          [[ "$REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "Only a vX.Y.Z tag, three numbers without leading zeros, is deployed, not '$REF'."
          echo "$REF is a vX.Y.Z tag."
      - name: Look up the GitHub Release of the tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # The job's token, which can only read (contents: read). curl reads it from stdin, so no command line has it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release | workflow_dispatch) ;;
            *) fail "The site is deployed only by publishing a release or by a manual run on a vX.Y.Z tag, not by a $EVENT_NAME event." ;;
          esac
          tag="${REF#refs/tags/}"
          # One GET, which GitHub answers with 200 only for a published Release. A release run makes it too: a re-run
          # keeps the event of the run it repeats, so only the answer says what the Release is now. The body, a newline
          # and the HTTP status go to the file that the next step reads.
          printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" |
            curl --silent --show-error --proto '=https' --max-time 60 --header @- \
              --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' \
              --write-out '\n%{http_code}' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              > "$RUNNER_TEMP/release-lookup" ||
            fail "GitHub could not be asked for the Release of $tag; only a tag that has a published Release that is not a prerelease is deployed."
          echo "Looked up the Release of $tag."
      - name: Refuse a tag without a published Release that is not a prerelease
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release | workflow_dispatch) ;;
            *) fail "The site is deployed only by publishing a release or by a manual run on a vX.Y.Z tag, not by a $EVENT_NAME event." ;;
          esac
          tag="${REF#refs/tags/}"
          # Says why the lookup's answer ($1: the body, a newline and the HTTP status) is not GitHub's 200 for a published
          # Release of tag $2 that is neither a draft nor a prerelease, and fails; says nothing if it is.
          check_release() {
            python3 -I - "$@" <<'PY'
          import json
          import sys

          path, tag = sys.argv[1:]
          try:
              with open(path, "rb") as file:
                  body, newline, status = file.read().rpartition(b"\n")
          except OSError as error:
              sys.exit(f"The Release lookup left no answer ({error.strerror}).")
          if not newline:
              sys.exit("The answer to the Release lookup has no HTTP status.")
          status = status.decode("ascii", "replace")
          if status != "200":
              sys.exit(f"GitHub answered the Release lookup with HTTP {status or '(none)'}, not 200 (404: the tag has no published Release).")
          try:
              release = json.loads(body)
          except ValueError as error:
              sys.exit(f"The answer to the Release lookup is not JSON ({error}).")
          if not isinstance(release, dict):
              sys.exit("The answer to the Release lookup is not a JSON object.")
          wrong = []
          for key, wanted in (("tag_name", tag), ("draft", False), ("prerelease", False)):
              if key not in release:
                  wrong.append(f"no {key}")
              elif type(release[key]) is not type(wanted) or release[key] != wanted:
                  wrong.append(f"{key} {json.dumps(release[key])}")
          if wrong:
              sys.exit(f"The Release GitHub returned has {', '.join(wrong)} (needed: tag_name {json.dumps(tag)}, draft false, prerelease false).")
          PY
          }
          reason="$(check_release "$RUNNER_TEMP/release-lookup" "$tag" 2>&1)" ||
            fail "A run on $tag is refused. $reason Only a tag that has a published Release that is not a prerelease is deployed."
          echo "$tag has a published GitHub Release that is not a prerelease."
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Every branch and tag with their commits, to find the release commit on main, and the release's files.
          fetch-depth: 0
          filter: blob:none
      - name: Refuse a release commit that is not on main
        env:
          SHA: ${{ github.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          head="$(git rev-parse --verify HEAD)" || fail "The checkout has no commit."
          [ "$head" = "$SHA" ] || fail "The checkout is $head, not the release commit $SHA."
          # The remote-tracking branch by its full name: a tag or local branch named like it cannot stand in for it.
          main="$(git show-ref --verify --hash refs/remotes/origin/main)" || fail "The checkout has no origin/main to look for $SHA on."
          git merge-base --is-ancestor "$SHA" "$main" || fail "$SHA is not on main; only a commit on main is released."
          echo "$SHA is on main."
      - name: Test publication boundary
        run: python3 -I tests/test_pages.py
      - name: Stage allowlisted public website files
        run: python3 -I scripts/prepare_pages.py --output "$RUNNER_TEMP/deemo-site"
      - name: Upload website artifact only
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/deemo-site
          retention-days: 1

  deploy:
    name: Deploy
    needs: [guard, test, build]
    # The release tag once more, in the expression language, which has no regular expressions: the guard steps check the
    # whole vX.Y.Z tag and the tag's Release. The commit must be the one the guard job approved, in this attempt of the
    # run: a re-run that leaves out the guard job, such as one of the deploy job alone, keeps the guard job's outputs of
    # the attempt it repeats, so it deploys nothing, and the re-run check job below fails it. Its == takes null for
    # false, so the prerelease flag goes through toJSON(), which gives 'false' only for false. The job runs no
    # repository code; it only has the Pages and OIDC grants.
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.guard.outputs.commit == github.sha &&
      needs.guard.outputs.attempt == github.run_attempt &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.action == 'published' &&
      toJSON(github.event.release.prerelease) == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  rerun-check:
    # A re-run that leaves out the guard job (the deploy job alone, or the failed jobs after the test, build or deploy
    # job failed) skips the deploy job, and would end green with nothing deployed. GitHub re-runs a job together with
    # every job that needs it, so such a re-run runs this job too, and it fails the run with the reason. always() has
    # GitHub evaluate the condition whatever the jobs it needs did; it holds only if the guard job succeeded and its
    # outputs name another attempt than this one, as they do when a re-run keeps them from the attempt it repeats. So
    # this job is skipped in an attempt that ran the guard job, whether the deploy job deployed or not, and in a run
    # that the guard job refused. It needs every job before it, as the deploy job does, runs no checkout and no action,
    # and has no permissions.
    name: Re-run check
    needs: [guard, test, build, deploy]
    if: >-
      always() && needs.guard.result == 'success' &&
      needs.guard.outputs.attempt != github.run_attempt
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Refuse an attempt that did not run the Release guard job
        run: |
          echo "::error::This attempt did not run the Release guard job, so it deployed nothing. Re-run all jobs to deploy the release."
          exit 1
