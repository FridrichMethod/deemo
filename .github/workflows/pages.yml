name: Publish public gallery

# Only a vX.Y.Z tag whose commit is on main is deployed. Publishing a GitHub Release with such a tag deploys its commit,
# and a manual run on such a tag (gh workflow run pages.yml --ref vX.Y.Z) deploys that commit; a manual run does
# not look up the tag's Release, so use it only to redeploy a released tag. Pushes, pull requests and schedules never
# start this workflow; tests.yml checks them. The guard job refuses, with an error, every other run: another event, a
# branch, a release marked as a prerelease, a tag that is not vX.Y.Z (three numbers without leading zeros), a commit
# that is not on main. The full tests.yml then runs on the release commit, the build job repeats the guards before
# anything else and stages the site, and the deploy job, whose condition requires a release tag again, publishes it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse anything but a published release or a manual run on a vX.Y.Z tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          # In the C locale [0-9] is the ASCII digits only; in others it can match other scripts' digits too.
          LC_ALL: C
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release)
              [ "$EVENT_ACTION" = "published" ] || fail "Only publishing a release deploys the site, not a release event of type '$EVENT_ACTION'."
              [ "$PRERELEASE" = "false" ] || fail "Release $RELEASE_TAG is a prerelease, or does not say it is not one; a release marked as a prerelease is not deployed."
              [ "$REF" = "refs/tags/$RELEASE_TAG" ] || fail "The release's tag $RELEASE_TAG is not the run's ref $REF."
              ;;
            workflow_dispatch) ;;
            *) fail "The site is deployed only by publishing a release or by a manual run on a vX.Y.Z tag, not by a $EVENT_NAME event." ;;
          esac
          [[ "$REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "Only a vX.Y.Z tag, three numbers without leading zeros, is deployed, not '$REF'."
          echo "$REF is a vX.Y.Z tag."
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Every branch and tag with their commits, to find the release commit on main; the files of the root and
          # .github/ only.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - name: Refuse a release commit that is not on main
        env:
          SHA: ${{ github.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          head="$(git rev-parse --verify HEAD)" || fail "The checkout has no commit."
          [ "$head" = "$SHA" ] || fail "The checkout is $head, not the release commit $SHA."
          # The remote-tracking branch by its full name: a tag or local branch named like it cannot stand in for it.
          main="$(git show-ref --verify --hash refs/remotes/origin/main)" || fail "The checkout has no origin/main to look for $SHA on."
          git merge-base --is-ancestor "$SHA" "$main" || fail "$SHA is not on main; only a commit on main is released."
          echo "$SHA is on main."

  test:
    # The same checks as on every push and pull request, on the release commit; nothing is built unless they all pass.
    name: Test
    needs: guard
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    name: Build website artifact
    needs: [guard, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The guard job's steps again, before anything from the checkout runs (defence in depth).
      - name: Refuse anything but a published release or a manual run on a vX.Y.Z tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          # In the C locale [0-9] is the ASCII digits only; in others it can match other scripts' digits too.
          LC_ALL: C
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT_NAME" in
            release)
              [ "$EVENT_ACTION" = "published" ] || fail "Only publishing a release deploys the site, not a release event of type '$EVENT_ACTION'."
              [ "$PRERELEASE" = "false" ] || fail "Release $RELEASE_TAG is a prerelease, or does not say it is not one; a release marked as a prerelease is not deployed."
              [ "$REF" = "refs/tags/$RELEASE_TAG" ] || fail "The release's tag $RELEASE_TAG is not the run's ref $REF."
              ;;
            workflow_dispatch) ;;
            *) fail "The site is deployed only by publishing a release or by a manual run on a vX.Y.Z tag, not by a $EVENT_NAME event." ;;
          esac
          [[ "$REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "Only a vX.Y.Z tag, three numbers without leading zeros, is deployed, not '$REF'."
          echo "$REF is a vX.Y.Z tag."
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Every branch and tag with their commits, to find the release commit on main, and the release's files.
          fetch-depth: 0
          filter: blob:none
      - name: Refuse a release commit that is not on main
        env:
          SHA: ${{ github.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          head="$(git rev-parse --verify HEAD)" || fail "The checkout has no commit."
          [ "$head" = "$SHA" ] || fail "The checkout is $head, not the release commit $SHA."
          # The remote-tracking branch by its full name: a tag or local branch named like it cannot stand in for it.
          main="$(git show-ref --verify --hash refs/remotes/origin/main)" || fail "The checkout has no origin/main to look for $SHA on."
          git merge-base --is-ancestor "$SHA" "$main" || fail "$SHA is not on main; only a commit on main is released."
          echo "$SHA is on main."
      - name: Test publication boundary
        run: python3 -I tests/test_pages.py
      - name: Stage allowlisted public website files
        run: python3 -I scripts/prepare_pages.py --output "$RUNNER_TEMP/deemo-site"
      - name: Upload website artifact only
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/deemo-site
          retention-days: 1

  deploy:
    name: Deploy
    needs: [guard, test, build]
    # The release tag once more, in the expression language, which has no regular expressions: the guard steps check
    # the whole vX.Y.Z tag. Its == takes null for false, so the prerelease flag goes through toJSON(), which gives
    # 'false' only for false. The job runs no repository code; it only has the Pages and OIDC grants.
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.action == 'published' &&
      toJSON(github.event.release.prerelease) == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
