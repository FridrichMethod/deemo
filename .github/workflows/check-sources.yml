name: Check wiki sources

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-sources
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SNAPSHOT_BRANCH: auto/wiki-source-check
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  # How `gh pr list --json author` names github-actions[bot].
  BOT_LOGIN: app/github-actions
  # Only the bot's own pull request from this repository: anyone can open a pull request from a fork
  # whose branch has the same name.
  BOT_PR_QUERY: '[.[] | select(.isCrossRepository == false and .author.login == env.BOT_LOGIN)][0].number // empty'

jobs:
  discover:
    # Installs packages from PyPI and parses wiki responses, so it gets a read-only token and keeps no
    # credentials on disk. Only the new snapshot files leave this job, as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Refuse refs other than main
        # The snapshot is compared with the checked-out commit and its pull request targets main, so a run
        # from another branch would put that branch's commits into the pull request.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main, not $GITHUB_REF."
          exit 1
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install fetch dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -r requirements.txt
      - name: Keep the committed snapshot as baseline
        run: cp data/sources/wiki-discovery.json "$RUNNER_TEMP/baseline-discovery.json"
      - name: Discover wiki candidates without downloading images
        run: '"$RUNNER_TEMP/venv/bin/python" -I scripts/fetch_wikis.py --metadata-only'
      - name: Drop the unrelated song-key refresh
        run: git checkout -- data/sources/song-mapping.json
      - name: Compare with the committed snapshot
        id: compare
        run: |
          python3 -I scripts/check_sources.py \
            --baseline "$RUNNER_TEMP/baseline-discovery.json" \
            --current data/sources/wiki-discovery.json \
            --manifest data/sources/wikis.json \
            --report "$RUNNER_TEMP/report.md" \
            --summary "$RUNNER_TEMP/summary.json"
          python3 -I - "$RUNNER_TEMP/summary.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          print("changed=" + str(summary["changed"]).lower())
          PY
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Hand the new snapshot to the publishing job
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wiki-snapshot
          path: |
            data/sources/wiki-discovery.json
            data/sources/wiki-song-index.json
          if-no-files-found: error
          retention-days: 7

  publish:
    # The only job that can write. It runs no third-party code: it treats the artifact as data, rebuilds
    # the report from it with the standard library, commits the two snapshot files and opens or updates
    # the pull request. The token reaches git only for the push and is never written to .git/config.
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Commits of every branch (no file contents) to inspect the snapshot branch before overwriting it.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            data/sources
            scripts
      - name: Download the new snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wiki-snapshot
          path: ${{ runner.temp }}/snapshot
      - name: Rebuild the report from the new snapshot
        run: |
          python3 -I -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$RUNNER_TEMP/snapshot/wiki-song-index.json"
          python3 -I scripts/check_sources.py \
            --baseline data/sources/wiki-discovery.json \
            --current "$RUNNER_TEMP/snapshot/wiki-discovery.json" \
            --manifest data/sources/wikis.json \
            --report "$RUNNER_TEMP/report.md" \
            --summary "$RUNNER_TEMP/summary.json"
          python3 -I - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys
          if not json.load(open(sys.argv[1], encoding="utf-8"))["changed"]:
              sys.exit("::error::The snapshot handed over by the discover job does not differ from main.")
          PY
      - name: Open or update the snapshot pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["title"])' "$RUNNER_TEMP/summary.json")"
          # Never overwrite commits that someone else added to the snapshot branch; the lease also stops the
          # push if the branch moves after this check. An empty lease means the branch must not exist yet.
          if lease="$(git rev-parse --verify --quiet "refs/remotes/origin/$SNAPSHOT_BRANCH^{commit}")"; then
            others="$(git log --format='%ae%x09%ce%x09%h %an <%ae>: %s' "HEAD..$lease" \
              | awk -F '\t' -v bot="$BOT_EMAIL" '$1 != bot || $2 != bot { print $3 }')"
            if [ -n "$others" ]; then
              echo "::error::$SNAPSHOT_BRANCH has commits not made by github-actions[bot]; not overwriting them. Merge or move them, then delete the branch."
              printf '%s\n' "$others"
              exit 1
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "$BOT_EMAIL"
          git checkout -B "$SNAPSHOT_BRANCH"
          cp -- "$RUNNER_TEMP/snapshot/wiki-discovery.json" "$RUNNER_TEMP/snapshot/wiki-song-index.json" data/sources/
          git add -- data/sources/wiki-discovery.json data/sources/wiki-song-index.json
          git commit -m "chore: refresh wiki discovery snapshot" -m "$title" -m "Metadata only; no images downloaded. $RUN_URL"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            git push --force-with-lease="refs/heads/$SNAPSHOT_BRANCH:$lease" origin "HEAD:refs/heads/$SNAPSHOT_BRANCH"
          printf '\n---\nSource · 来源: %s\n' "$RUN_URL" >> "$RUNNER_TEMP/report.md"
          number="$(gh pr list --head "$SNAPSHOT_BRANCH" --base main --state open \
            --json number,isCrossRepository,author --jq "$BOT_PR_QUERY")"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/report.md"
            gh pr comment "$number" --body "Snapshot refreshed by a new check run · 快照已由新的检查运行刷新: $RUN_URL"
          else
            gh pr create --base main --head "$SNAPSHOT_BRANCH" --title "$title" --body-file "$RUNNER_TEMP/report.md"
          fi

  close-stale:
    # The wikis match main's snapshot again, so an open snapshot pull request is outdated: merging it would
    # put a wrong baseline on main.
    needs: discover
    if: needs.discover.outputs.changed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Close an outdated snapshot pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh pr list --head "$SNAPSHOT_BRANCH" --base main --state open \
            --json number,isCrossRepository,author --jq "$BOT_PR_QUERY")"
          if [ -z "$number" ]; then
            echo "No open snapshot pull request."
            exit 0
          fi
          gh pr close "$number" --comment "The latest check found no differences from the snapshot on main, so this snapshot is outdated; closing it. The next run that finds changes opens a new pull request. · 最新检查未发现与 main 上快照的差异，此快照已过时，现关闭；之后的运行发现变化时会创建新的 PR。 $RUN_URL"
