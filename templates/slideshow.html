<body>
    <main class="deemo-view">
        <div class="slideshow-container">
            @python-work-area

            <button type="button" class="prev" aria-label="Previous artwork" data-i18n-attr="aria-label:slideshow.nav.prev" onclick="plusSlides(-1)"></button>
            <button type="button" class="next" aria-label="Next artwork" data-i18n-attr="aria-label:slideshow.nav.next" onclick="plusSlides(1)"></button>
        </div>
        <!-- Liner notes: Alice's dedication opens the show (and returns as an autoplay interlude), then each slide's own notes. -->
        <section class="liner" aria-label="About this artwork" data-i18n-attr="aria-label:slideshow.notes.label">
            <div class="liner-text is-dedication" data-slide-text>
                <blockquote class="dear-alice" lang="en">To the lovely, lonely stranger<br>And my dearest brother,<br>Hans.
                    <p>-Alice</p>
                </blockquote>
                <div class="slide-notes"></div>
            </div>
            <div class="asset-caption">
                <div class="asset-heading"><span id="asset-title"></span><span class="asset-title-sep"> · </span><span id="asset-size"></span></div>
                <!-- Each separator keeps to the end of its line (no-break space before it), so no line starts with a dot. -->
                <a id="asset-source" target="_blank" rel="noopener noreferrer"><span data-i18n="slideshow.caption.source">Source</span></a>&nbsp;·
                <a id="asset-original" download data-i18n="slideshow.caption.original">Original file</a>&nbsp;· <a href="archive.html" data-lang-link data-i18n="slideshow.caption.browse">Browse all / Search</a>
            </div>
        </section>
        <div class="signature">DEEMO 1 · <a href="https://github.com/FridrichMethod" target="_blank" rel="noopener noreferrer">FridrichMethod</a></div>

        <!-- The bottom control row in its on-screen order, left to right, so Tab follows it (see src/slideshow.css). -->
        <div class="photo bt">
            <button type="button" aria-label="Take a screenshot" data-i18n-attr="aria-label:slideshow.screenshot.take" onclick="screenshot()">

            </button>
        </div>

        <div class="github bt">
            <a href="https://github.com/FridrichMethod/deemo" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository" data-i18n-attr="aria-label:slideshow.github.label">
                <div class="pop"><img src="assets/site/icons/github.svg" alt="" class="css-1bgbwga" data-reactid="50"></div>
            </a>
        </div>

        <div class="archive-link bt"><a href="archive.html" data-lang-link title="Browse the Artwork Archive" data-i18n="slideshow.archive.text" data-i18n-attr="title:slideshow.archive.label">Gallery</a></div>

        <div class="random bt">

                <span class="pop"><img src="assets/site/icons/sand-clock.svg" alt="" class="sand-clock" data-reactid="50"></span>
            </button>
        </div>

        <!-- Opened by screenshot() with the is-open class, not the URL hash, so a reload, Back or a shared link never reopens it empty. -->
        <div id="screenshot" class="overlay" role="dialog" aria-modal="true" aria-label="Screenshot preview" data-i18n-attr="aria-label:slideshow.screenshot.dialog">
            <div class="save bt">

                </button>
            </div>
            <div class="popup">
                <button type="button" class="close" aria-label="Close screenshot" data-i18n-attr="aria-label:slideshow.screenshot.close" onclick="closeScreenshot()">&times;</button>

        </div>

        <!-- Kept after #screenshot so the open screenshot overlay can hide it (see src/slideshow.css). -->
        <button type="button" class="lang-toggle bt" data-lang-toggle title="Switch to Simplified Chinese"><span lang="zh-CN">中文</span></button>
    </main>

    <audio loop="loop" id="player">
      <source src="assets/site/audio/Riin%20-%20Alice%20good%20night.mp3" type="audio/mpeg">
    </audio>

    <script>
        // The language toggle rewrites ?lang= with history.replaceState; keep Pace from treating that as a page load.
        window.paceOptions = {restartOnPushState: false};
    </script>
    <script src="src/vendor/legacy-ui.js"></script>
    <script src="src/i18n.js"></script>
    <script src="src/i18n/common.js"></script>
    <script src="src/i18n/slideshow.js"></script>

    <script>
        "use strict";

        var slideIndex = 1;
        var imgTargets = document.getElementsByClassName("deemo-draw");
        var requestedAsset = new URLSearchParams(location.search).get("asset");
        var requestedIndex = Array.from(imgTargets).findIndex(function(img) { return img.dataset.id === requestedAsset; });
        var linerText = document.querySelector("[data-slide-text]");
        var slideNotes = linerText.querySelector(".slide-notes");
        var caption = document.querySelector(".asset-caption");
        var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        var dedicationShown = true;
        var notesTimer = 0;
        // Alice's dedication returns over every fifth automatic turn, then hands over to that slide's notes.
        var DEDICATION_EVERY = 5;
        var autoTurns = 0;
        // Until the first slide is shown this page title is localized; showSlides() then owns document.title.
        var slideShown = false;
        document.title = DEEMO_I18N.t("slideshow.title");
        DEEMO_I18N.onChange(function() {
            if (slideShown) {
                showCaption();
                showNotes(false);
            } else document.title = DEEMO_I18N.t("slideshow.title");
        });
        // A deep link opens straight on that slide's notes; otherwise the page opens on Alice's dedication.
        if (requestedIndex >= 0) setDedication(false);

        window.addEventListener('load', function() {
            document.querySelector(".deemo-view").style.opacity = "1";
            if (requestedIndex >= 0) {
                slideIndex = requestedIndex + 1;
                showSlides();
                if (randomFlag == 0) randomClick();
            } else if (randomFlag == 0) {
                // Restart the beat so the dedication gets a full one before the first hand-over.
                window.clearInterval(int);
                int = self.setInterval(autoplayTick, 6000);
                randomSlide();
            } else if (!slideShown) {
                // Paused (sand clock or arrows) before the page loaded: show a slide, but leave autoplay off.
                randomSlide();
            }
            for (var i = 0; i < document.getElementsByClassName("bt").length; i++) {
                document.getElementsByClassName("bt")[i].style.opacity = "1";
            }
        });

        // Timeout
        var int = self.setInterval(autoplayTick, 6000);

        // Each autoplay beat first hands Alice's dedication over to the current slide's notes, then moves on;
        // every fifth turn brings the dedication back over the new slide.
        function autoplayTick() {
            // A beat before the page has loaded (and shown its first slide) would spend the opening dedication.
            if (!slideShown) return;
            if (dedicationShown) {
                setDedication(false);
                return;
            }
            autoTurns = (autoTurns + 1) % DEDICATION_EVERY;
            if (!autoTurns) setDedication(true);
            randomSlide();
        }

        function plusSlides(n) {
            showSlides(slideIndex += n);
            setDedication(false);
            try {
                int = window.clearInterval(int);
                showAutoplay(false);
                randomFlag = 1;
            } catch (err) {}
        }

        function showSlides() {
            var i;
            var slides = document.getElementsByClassName("mySlides");
            // control
            if (slideIndex == 0) {
                slideIndex = imgTargets.length;
            } else if (slideIndex == imgTargets.length + 1) {
                slideIndex = 1;
            }
            // title
            document.title = slideIndex + '/' + slides.length + ' | DEEMO 1 · FridrichMethod';
            // The caption always describes the current slide; the first slide's notes are in place at once, later
            // ones turn with the artwork.
            showCaption();
            showNotes(slideShown);
            slideShown = true;
            // load
            lazyload(slideIndex - 1);
            // hide
            for (i = 0; i < slides.length; i++) {
                slides[i].style.opacity = 0;
            }
            // check load condition
            var displayedIndex = slideIndex - 1;
            imgLoad(displayedIndex, function() {
                // display
                if (slideIndex - 1 === displayedIndex) slides[displayedIndex].style.opacity = 1;
            });
            // preload
            //if (slideIndex < imgTargets.length) {
            //    lazyload(slideIndex - 1 + 1);
            //}
            //if (slideIndex > 1) {
            //    lazyload(slideIndex - 1 - 1);
            //}
        }

        // caption (re-run on language change; source names from the data stay verbatim except localized ones such as legacy)
        function showCaption() {
            var target = imgTargets[slideIndex - 1];
            if (!target) return;
            document.getElementById("asset-title").textContent = target.dataset.title;
            document.getElementById("asset-size").textContent = target.dataset.size;
            document.getElementById("asset-source").textContent = DEEMO_I18N.sourceName(target.dataset.sourceId, target.dataset.source);
            document.getElementById("asset-source").href = target.dataset.page;
            document.getElementById("asset-original").href = target.dataset.src;
        }

        // While the notes are up the caption leaves out the title they already show (see src/slideshow.css).
        function setDedication(show) {
            dedicationShown = show;
            if (show) autoTurns = 0;
            // Notes still waiting to change under the dedication change now, before they fade back in.
            else if (notesTimer && !slideNotes.classList.contains("is-turning")) renderNotes();
            linerText.classList.toggle("is-dedication", show);
        }

        function element(tag, className, text) {
            var node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        function metaRow(list, label, value) {
            if (!value) return;
            var values = value.split("\n");
            var dd = element("dd");
            values.forEach(function(line, i) {
                if (i) dd.append(document.createElement("br"));
                dd.append(line);
            });
            list.append(element("dt", null, label), dd);
        }

        // A title that is only a file name ("booksprites_10", "Rac01lifill", "Celia02forsis fc", "MN2 Booksprites")
        // stays verbatim but is set as a quiet file reference rather than as the headline (see src/slideshow.css).
        function isFileName(title, id) {
            var words = title.split(" ");
            return /_|booksprite/i.test(title)
                || (title === id.slice(id.lastIndexOf(":") + 1) && title === title.toLowerCase())
                || (/^[A-Za-z0-9 ]+$/.test(title)
                    && words.some(function(word) { return /[A-Za-z]/.test(word) && /\d/.test(word); })
                    && words.slice(1).every(function(word) { return word === word.toLowerCase(); }));
        }

        // Liner notes from the slide's data-* attributes: names stay verbatim, only labels are translated.
        function notesFor(target) {
            var data = target.dataset;
            var notes = document.createDocumentFragment();
            var eyebrow = element("p", "notes-eyebrow");
            var kind = DEEMO_I18N.has("slideshow.kind." + data.kind) ? DEEMO_I18N.t("slideshow.kind." + data.kind) : "";
            if (kind) eyebrow.append(element("span", "notes-kind", kind));
            eyebrow.append(element("span", "notes-count", slideIndex + " / " + imgTargets.length));
            // A wiki title that names none of the slide's mapped songs (data-songs) is only the file's key
            // ("Classic01" for "Tristesse"): the songs are the headline and the key follows as a quiet file
            // reference. A title that looks like a file name names a song only when it is the song's name ("Cloud9",
            // "U7228"), never by containment ("Celia02forsis fc" for "For Sis", "Code11" for "Code : 11"). Any other
            // title names a song when either contains the other, ignoring case, accents and punctuation ("Fur Alice",
            // "Continuum (DEEMO Ver.)").
            var songs = data.songs ? data.songs.split("\n") : [];
            var fold = function(text) { return text.normalize("NFKD").toLowerCase().replace(/[^\p{L}\p{N}]/gu, ""); };
            var folded = fold(data.title);
            var file = isFileName(data.title, data.id);
            var named = songs.some(function(song) {
                if (file) return song.toLowerCase() === data.title.toLowerCase();
                var name = fold(song);
                return Boolean(name && folded) && (folded.indexOf(name) >= 0 || name.indexOf(folded) >= 0);
            });
            var fileKey = songs.length && !named && /^wikis:/.test(data.sourceId || "") ? data.title : "";
            var headline = fileKey ? songs.join(" / ") : data.title;
            // A wrapping title breaks after its last spaced dash ("Book of Alice —" / "page 1"), never before a dash
            // or a trailing number: each side of that dash is kept whole where it fits (see src/slideshow.css).
            var title = element("p", "notes-title");
            var glued = headline.replace(/ — /g, "\u00a0— ").replace(/ (\d+)$/, "\u00a0$1");
            var dash = glued.lastIndexOf("\u00a0— ");
            if (dash > 0) title.append(element("span", "notes-title-part", glued.slice(0, dash + 2)), " ", element("span", "notes-title-part", glued.slice(dash + 3)));
            else title.textContent = glued;
            // CJK characters count double, so long titles step down a size before they wrap into many lines.
            var weight = Array.from(headline).reduce(function(sum, char) {
                return sum + (/[\u1100-\u11ff\u2e80-\ua4cf\uac00-\ud7af\uf900-\ufaff\uff00-\uffef]/.test(char) ? 2 : 1);
            }, 0);
            if (file && !named && !fileKey) title.dataset.length = "file";
            else if (weight > 30) title.dataset.length = "longer";
            else if (weight > 18) title.dataset.length = "long";
            var meta = element("dl", "notes-meta");
            metaRow(meta, DEEMO_I18N.t("slideshow.notes.music"), data.composer);
            metaRow(meta, DEEMO_I18N.t("slideshow.notes.artist"), data.artist);
            if (data.collection) {
                metaRow(meta, data.collection.indexOf("\n") >= 0 ? DEEMO_I18N.t("slideshow.notes.collections") : DEEMO_I18N.t("slideshow.notes.collection"), data.collection);
            }
            notes.append(eyebrow, title);
            if (fileKey) {
                var reference = element("p", "notes-title", fileKey);
                reference.dataset.length = "file";
                notes.append(reference);
            }
            if (meta.childElementCount) notes.append(meta);
            return notes;
        }

        function renderNotes() {
            window.clearTimeout(notesTimer);
            notesTimer = 0;
            slideNotes.classList.remove("is-turning");
            caption.classList.remove("is-turning");
            slideNotes.replaceChildren(notesFor(imgTargets[slideIndex - 1]));
        }

        // Visible notes dip out, change and fade back in with the artwork; notes giving way to the dedication
        // change once they have faded out under it. The caption already shows the new slide's fine print, so it
        // stays hidden until the notes change and then fades back in with them, never ahead of the notes.
        function showNotes(animate) {
            if (!imgTargets[slideIndex - 1]) return;
            window.clearTimeout(notesTimer);
            if (!animate || reducedMotion.matches) {
                renderNotes();
                return;
            }
            if (!dedicationShown) slideNotes.classList.add("is-turning");
            caption.classList.add("is-turning");
            notesTimer = window.setTimeout(renderNotes, dedicationShown ? 420 : 260);
        }

        // check picture load condition
        function imgLoad(n, callback) {
            var img = imgTargets[n];
            if (img.complete) callback(img);
            else img.addEventListener("load", function() { callback(img); }, {once: true});
        }

        function lazyload(n) {
            try {
                // The stage fits every artwork's visible part to the same visual area (it needs that part's aspect ratio
                // and its square root), but never beyond twice its natural width, so small icons stay crisp. The visible
                // part is the whole image, or for a padded game texture its opaque box (data-art-box: "x y w h" as
                // fractions of the canvas); the image is then enlarged by 1 / w and shifted to centre that box.
                var img = imgTargets[n];
                var size = img.dataset.size.match(/\d+/g);
                var box = (img.dataset.artBox || "0 0 1 1").split(" ").map(Number);
                var width = size[0] * box[2];
                var ratio = width / (size[1] * box[3]);
                img.style.setProperty("--ratio", ratio);
                img.style.setProperty("--root", Math.sqrt(ratio));
                img.style.setProperty("--natural-width", width + "px");
                img.style.setProperty("--canvas-ratio", size[0] / size[1]);
                img.style.setProperty("--box-width", box[2]);
                img.style.setProperty("--box-height", box[3]);
                img.style.setProperty("--shift-x", .5 - box[0] - box[2] / 2);
                img.style.setProperty("--shift-y", .5 - box[1] - box[3] / 2);
                img.setAttribute("src", img.getAttribute("data-src"));
            } catch (err) {
                console.log("error = " + n);
            }
        }

        // Random
        function randomSlide() {
            var rand = Math.floor(Math.random() * imgTargets.length) + 1;
            showSlides(slideIndex = rand);
        }

        var randomFlag = 0;

        // The sand clock is pressed while autoplay runs, which also tilts it (see src/slideshow.css).
        function showAutoplay(on) {
            document.querySelector(".random button").setAttribute("aria-pressed", String(on));
        }

        function randomClick() {
            if (randomFlag == 1) {
                int = self.setInterval(autoplayTick, 6000);
                showAutoplay(true);
                // Resuming autoplay replays the opening: the dedication first, the notes on the next beat.
                setDedication(true);
                randomSlide();
                randomFlag = 0;
            } else {
                int = window.clearInterval(int);
                showAutoplay(false);
                setDedication(false);
                randomFlag = 1;
            }
        }

        // Screenshot overlay: one canvas at a time, shown with a class (see the markup) and dropped on close.
        var screenshotOverlay = document.getElementById("screenshot");
        var screenshotContent = document.getElementById("scerrn-content");

        function isScreenshotOpen() {
            return screenshotOverlay.classList.contains("is-open");
        }

        function setScreenshotOpen(open) {
            screenshotOverlay.classList.toggle("is-open", open);
            // While it is open the page behind it is inert, so Tab and the arrow keys stay with the overlay.
            Array.prototype.forEach.call(screenshotOverlay.parentElement.children, function(child) {
                if (child !== screenshotOverlay) child.inert = open;
            });
            if (open) {
                screenshotOverlay.querySelector(".save button").focus();
            } else {
                screenshotContent.replaceChildren();
                document.querySelector(".photo button").focus();
            }
        }

        function closeScreenshot() {
            if (isScreenshotOpen()) setScreenshotOpen(false);
        }

        function downloadCanvas() {
            var canvas = screenshotContent.querySelector("canvas");
            if (!canvas) return;
            canvas.toBlob(function(blob) {
                if (!blob) return;
                var link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "deemo-" + Date.now() + ".png";
                document.body.append(link);
                link.click();
                link.remove();
                // The download reads the blob after the click returns; release it once that has had ample time.
                window.setTimeout(URL.revokeObjectURL.bind(URL, link.href), 40000);
            }, "image/png");
        }

        // Keyboard: Escape closes the screenshot overlay; the arrow keys turn the slides, but not while the overlay
        // is open or a form field has focus, and a held key does not race through the collection.
        document.addEventListener("keydown", function(event) {
            if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
            if (isScreenshotOpen()) {
                if (event.key === "Escape") closeScreenshot();
                return;
            }
            var step = event.key === "ArrowLeft" ? -1 : event.key === "ArrowRight" ? 1 : 0;
            if (!step || event.shiftKey || event.repeat) return;
            if (event.target instanceof Element && event.target.closest("input, textarea, select, [contenteditable]:not([contenteditable='false'])")) return;
            event.preventDefault();
            plusSlides(step);
        });

        function screenshot() {
            var sholdHide = new Array("photo", "iplayer", "random", "github", "archive-link", "lang-toggle", "asset-caption", "signature", "prev", "next");
            for (var i = 0; i < sholdHide.length; i++) document.getElementsByClassName(sholdHide[i])[0].style.visibility = 'hidden';

            let opt = {
                async: true,
                useCORS: true
            };
            html2canvas(document.body, opt).then(function(canvas) {
                screenshotContent.replaceChildren(canvas);
                setScreenshotOpen(true);
            });

            for (var i = 0; i < sholdHide.length; i++) document.getElementsByClassName(sholdHide[i])[0].style.visibility = 'visible';
        }

        // Player
        function hasClass(el, className) {
            if (el.classList)
                var e = el.classList.contains(className);
            else
                var e = new RegExp('(^| )' + className + '( |$)', 'gi').test(el.className);
            return e;
        }

        function addClass(el, className) {
            if (el.classList)
                el.classList.add(className);
            else
                el.className += ' ' + className;
        }

        function removeClass(el, className) {
            if (el.classList)
                el.classList.remove(className);
            else
                el.className = el.className.replace(new RegExp('(^|\\b)' + className.split(' ').join('|') + '(\\b|$)', 'gi'), ' ');
        }

        var getaudio = document.getElementById("player");
        var audiostatus = 'off';
        var speaker = document.getElementById("speaker");

        speaker.addEventListener("click", function() {
            // on touchend?

            if (!hasClass(speaker, "speakerplay")) {
                if (audiostatus == 'off') {
                    addClass(speaker, 'speakerplay');
                    getaudio.load();
                    getaudio.play();
                    audiostatus = 'on';
                } else if (audiostatus == 'on') {
                    addClass(speaker, 'speakerplay');
                    getaudio.play()
                }
            } else if (hasClass(speaker, "speakerplay")) {
                getaudio.pause();
                removeClass(speaker, 'speakerplay');
                audiostatus = 'on';
            }
            speaker.setAttribute("aria-pressed", String(hasClass(speaker, "speakerplay")));
        });

        document.getElementById("player").addEventListener("ended", function() {
            removeClass(speaker, 'speakerplay');
            speaker.setAttribute("aria-pressed", "false");
            audiostatus = 'off';
        });

    </script>
</body>

</html>
