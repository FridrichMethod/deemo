        }

<body>
    <main class="deemo-view">
        <div class="slideshow-container">
            @python-work-area

            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>
        <div class="dear-alice">To the lovely, lonely stranger<br>And my dearest brother,<br>Hans.
            <p>-Alice</p>
        </div>
        <div class="signature">DEEMO 1 · <a href="https://github.com/FridrichMethod" target="_blank" rel="noopener noreferrer">FridrichMethod</a></div>
        <div class="asset-caption">
            <span id="asset-title"></span><br>
            <span id="asset-size"></span> · <a id="asset-source" target="_blank" rel="noopener noreferrer"><span data-i18n="slideshow.caption.source">Source</span></a>
            · <a id="asset-original" download data-i18n="slideshow.caption.original">Original file</a> · <a href="archive.html" data-lang-link data-i18n="slideshow.caption.browse">Browse all / Search</a>
        </div>

        <div class="photo bt">
            <a href="javascript:screenshot();">
                <div class="pop"><img src="assets/site/icons/camera.svg" class="css-1bgbwga" data-reactid="50"></div>
            </a>
        </div>

        <div class="iplayer bt">
            <div class="speaker" id="speaker"></div>
            <img src="assets/site/icons/pause.svg" style="width:0;height:0;">
        </div>

        <div class="random bt">
            <a href="javascript:randomClick();">
                <div class="pop"><img src="assets/site/icons/sand-clock.svg" class="sand-clock" data-reactid="50"></div>
            </a>
        </div>

        <div class="github bt">
            <a href="https://github.com/FridrichMethod/deemo" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository" data-i18n-attr="aria-label:slideshow.github.label">
                <div class="pop"><img src="assets/site/icons/github.svg" class="css-1bgbwga" data-reactid="50"></div>
            </a>
        </div>

        <div class="archive-link bt"><a href="archive.html" data-lang-link aria-label="Browse the Artwork Archive" data-i18n="slideshow.archive.text" data-i18n-attr="aria-label:slideshow.archive.label">Gallery</a></div>

        <div id="screenshot" class="overlay">
            <div class="save bt">
                <a href="javascript:downloadCanvas();">
                    <div class="pop"><img src="assets/site/icons/save.svg" class="css-1bgbwga" data-reactid="50"></div>
                </a>
            </div>
            <div class="popup">
                <a class="close" href="#">&times;</a>
                <div id="scerrn-content"></div>
            </div>
        </div>

        <!-- Kept after #screenshot so the open screenshot overlay can hide it (see src/slideshow.css). -->
        <button type="button" class="lang-toggle bt" data-lang-toggle title="Switch to Simplified Chinese"><span lang="zh-CN">中文</span></button>
    </main>

    <audio loop="loop" id="player">
      <source src="assets/site/audio/Riin%20-%20Alice%20good%20night.mp3" type="audio/mpeg">
    </audio>

    <script>
        // The language toggle rewrites ?lang= with history.replaceState; keep Pace from treating that as a page load.
        window.paceOptions = {restartOnPushState: false};
    </script>
    <script src="src/vendor/legacy-ui.js"></script>
    <script src="src/i18n.js"></script>
    <script src="src/i18n/common.js"></script>
    <script src="src/i18n/slideshow.js"></script>

    <script>
        "use strict";

        var slideIndex = 1;
        var imgTargets = document.getElementsByClassName("deemo-draw");
        var requestedAsset = new URLSearchParams(location.search).get("asset");
        var requestedIndex = Array.from(imgTargets).findIndex(function(img) { return img.dataset.id === requestedAsset; });
        // Until the first slide is shown this page title is localized; showSlides() then owns document.title.
        var slideShown = false;
        document.title = DEEMO_I18N.t("slideshow.title");
        DEEMO_I18N.onChange(function() {
            if (slideShown) showCaption();
            else document.title = DEEMO_I18N.t("slideshow.title");
        });

        window.addEventListener('load', function() {
            document.querySelector(".deemo-view").style.opacity = "1";
            if (requestedIndex >= 0) {
                slideIndex = requestedIndex + 1;
                showSlides();
                randomClick();
            } else {
                randomSlide();
            }
            for (var i = 0; i < document.getElementsByClassName("bt").length; i++) {
                document.getElementsByClassName("bt")[i].style.opacity = "1";
            }
        });

        // Timeout
        var int = self.setInterval("randomSlide()", 6000);

        function plusSlides(n) {
            showSlides(slideIndex += n);
            try {
                int = window.clearInterval(int);
                document.getElementsByClassName("sand-clock")[0].style.transform = "rotate(0deg)";
                randomFlag = 1;
            } catch (err) {}
        }

        function showSlides() {
            var i;
            var slides = document.getElementsByClassName("mySlides");
            // control
            if (slideIndex == 0) {
                slideIndex = imgTargets.length;
            } else if (slideIndex == imgTargets.length + 1) {
                slideIndex = 1;
            }
            // title
            document.title = slideIndex + '/' + slides.length + ' | DEEMO 1 · FridrichMethod';
            slideShown = true;
            showCaption();
            // load
            lazyload(slideIndex - 1);
            // hide
            for (i = 0; i < slides.length; i++) {
                slides[i].style.opacity = 0;
            }
            // check load condition
            var displayedIndex = slideIndex - 1;
            imgLoad(displayedIndex, function() {
                // display
                if (slideIndex - 1 === displayedIndex) slides[displayedIndex].style.opacity = 1;
            });
            // preload
            //if (slideIndex < imgTargets.length) {
            //    lazyload(slideIndex - 1 + 1);
            //}
            //if (slideIndex > 1) {
            //    lazyload(slideIndex - 1 - 1);
            //}
        }

        // caption (re-run on language change; source names from the data stay verbatim except localized ones such as legacy)
        function showCaption() {
            var target = imgTargets[slideIndex - 1];
            if (!target) return;
            document.getElementById("asset-title").textContent = target.dataset.title;
            document.getElementById("asset-size").textContent = target.dataset.size;
            document.getElementById("asset-source").textContent = DEEMO_I18N.sourceName(target.dataset.sourceId, target.dataset.source);
            document.getElementById("asset-source").href = target.dataset.page;
            document.getElementById("asset-original").href = target.dataset.src;
        }

        // check picture load condition
        function imgLoad(n, callback) {
            var img = imgTargets[n];
            if (img.complete) callback(img);
            else img.addEventListener("load", function() { callback(img); }, {once: true});
        }

        function lazyload(n) {
            try {
                imgTargets[n].setAttribute("src", imgTargets[n].getAttribute("data-src"));
            } catch (err) {
                console.log("error = " + n);
            }
        }

        // Random
        function randomSlide() {
            var rand = Math.floor(Math.random() * imgTargets.length) + 1;
            showSlides(slideIndex = rand);
        }

        var randomFlag = 0;

        function randomClick() {
            if (randomFlag == 1) {
                int = self.setInterval("randomSlide()", 6000);
                document.getElementsByClassName("sand-clock")[0].style.transform = "rotate(20deg)";
                randomSlide();
                randomFlag = 0;
            } else {
                int = window.clearInterval(int);
                document.getElementsByClassName("sand-clock")[0].style.transform = "rotate(0deg)";
                randomFlag = 1;
            }
        }

        function saveFile(url) {
            var date = new Date();
            var filename = "deemo-";
            filename = filename + date.getTime();
            filename = filename + ".png";
            var xhr = new XMLHttpRequest();
            xhr.responseType = 'blob';
            xhr.onload = function() {
                var a = document.createElement('a');
                a.href = window.URL.createObjectURL(xhr.response);
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                //a = null;
            };
            xhr.open('GET', url);
            xhr.send();
        }

        function downloadCanvas() {
            var src = document.getElementsByTagName("canvas");
            var img = src[src.length - 1].toDataURL("image/png");
            saveFile(img);
        }

        function screenshot() {
            var sholdHide = new Array("photo", "iplayer", "random", "github", "archive-link", "lang-toggle", "asset-caption", "signature", "prev", "next");
            for (var i = 0; i < sholdHide.length; i++) document.getElementsByClassName(sholdHide[i])[0].style.visibility = 'hidden';

            let opt = {
                async: true,
                useCORS: true
            };
            html2canvas(document.body, opt).then(function(canvas) {
                document.getElementById("scerrn-content").appendChild(canvas);
                location.href = "#screenshot";
            });

            for (var i = 0; i < sholdHide.length; i++) document.getElementsByClassName(sholdHide[i])[0].style.visibility = 'visible';
        }

        // Player
        function hasClass(el, className) {
            if (el.classList)
                var e = el.classList.contains(className);
            else
                var e = new RegExp('(^| )' + className + '( |$)', 'gi').test(el.className);
            return e;
        }

        function addClass(el, className) {
            if (el.classList)
                el.classList.add(className);
            else
                el.className += ' ' + className;
        }

        function removeClass(el, className) {
            if (el.classList)
                el.classList.remove(className);
            else
                el.className = el.className.replace(new RegExp('(^|\\b)' + className.split(' ').join('|') + '(\\b|$)', 'gi'), ' ');
        }

        var getaudio = document.getElementById("player");
        var audiostatus = 'off';
        var speaker = document.getElementById("speaker");

        speaker.addEventListener("click", function() {
            // on touchend?

            if (!hasClass(speaker, "speakerplay")) {
                if (audiostatus == 'off') {
                    addClass(speaker, 'speakerplay');
                    getaudio.load();
                    getaudio.play();
                    audiostatus = 'on';
                    return false;
                } else if (audiostatus == 'on') {
                    addClass(speaker, 'speakerplay');
                    getaudio.play()
                }
            } else if (hasClass(speaker, "speakerplay")) {
                getaudio.pause();
                removeClass(speaker, 'speakerplay');
                audiostatus = 'on';
            }
        });

        document.getElementById("player").addEventListener("ended", function() {
            removeClass(speaker, 'speakerplay');
            audiostatus = 'off';
        });

    </script>
</body>

</html>
